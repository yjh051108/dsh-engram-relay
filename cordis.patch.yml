# dsh-engram-relay bundle 层：插入插件行。
# 官方格式（docs/user/develop/basic/publish.md）：patch 是 YAML 数组，
# 顶层 `- insert:` 包裹新增的插件行；`name` 引用包名，Loader 从 profile
# node_modules 解析（依赖走官方闭包 fallback）。
# config 默认值写在此（复活器 loader.create 时自动带上；profile patch 可覆盖）。
# embedModel 留空 = 核心三通道纯算法语义引擎（零模型、零依赖，默认推荐）；
# 可选向量缓存增强：本地 fp32 bge-small-zh-v1.5 目录或环境变量 ENGRAM_EMBED_MODEL。
- insert:
    - id: dsh-engram-relay
      name: '@dsh-external/dsh-engram-relay'
      config:
        distillEveryTurns: 2
        injectBudgetTokens: 200
